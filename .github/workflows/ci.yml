name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Test & Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: gdgoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://dev:devpassword@127.0.0.1:5432/gdgoc?schema=public
      TEST_DATABASE_URL: postgresql://dev:devpassword@127.0.0.1:5432/gdgoc_test?schema=public
      JWT_SECRET: supersecret-key-that-is-at-least-32-characters-long-in-ci
      FRONTEND_URL: http://127.0.0.1:3000
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Setup test database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U dev -d gdgoc -c "CREATE DATABASE gdgoc_test;" || true
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Build packages and apps
        run: npm run build

      - name: Run unit & integration tests
        run: |
          node --check apps/web/script.js
          node --test scripts/assert-test-db.test.js
          npm run test:e2e --workspace=apps/api

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

